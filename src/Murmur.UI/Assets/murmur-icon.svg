<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Murmur app/tray icon ("Hum"): a signal line that rises into a lowercase m. Source for Assets/tray-ready.ico and the packaging/msix/Assets logos; tray-busy.ico is the same art in greyscale. -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="58" y2="58">
      <stop offset="0" stop-color="#56A0FF"/>
      <stop offset=".55" stop-color="#7A78FF"/>
      <stop offset="1" stop-color="#AE62F2"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".24" stop-color="#fff"/>
      <stop offset=".76" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="4" y="4" width="56" height="56" rx="15"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#tile)"/>
  <g clip-path="url(#tile-clip)">
    <path d="M0 43 H15 a4 4 0 0 0 4 -4 V28.5 a6.5 6.5 0 0 1 13 0 V43 V28.5 a6.5 6.5 0 0 1 13 0 V39 a4 4 0 0 0 4 4 H64" fill="none" stroke="url(#line)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
